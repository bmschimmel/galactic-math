name = "galactic-math-feedback"
main = "feedback-worker.js"
compatibility_date = "2026-09-10"

[ai]
binding = "AI"

# Cloudflare Rate Limiting binding: 3 submissions per IP per 60 seconds.
# The binding only accepts a period of 10 or 60 seconds. Counters are shared
# by every instance of the worker in a Cloudflare location and survive restarts.
[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 3
period = 60

# Per-IP submission throttle. Cloudflare's Rate Limiting binding only accepts a
# period of 10 or 60 seconds, so this is 3 submissions per IP per minute. The
# namespace_id just needs to be unique within this worker.
[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[observability]
enabled = true

[observability.logs]
invocation_logs = true
