<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Deck</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23030712'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231a2744' stroke='%2300d4ff' stroke-width='1.5'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.5' fill='none' stroke='%23ffd700' stroke-width='1.5' opacity='0.9'/%3E%3Ccircle cx='7' cy='8' r='1.2' fill='%23e8f4ff' opacity='0.7'/%3E%3Ccircle cx='26' cy='7' r='1' fill='%23e8f4ff' opacity='0.5'/%3E%3Ccircle cx='27' cy='24' r='1.2' fill='%23e8f4ff' opacity='0.6'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* ===== TOKENS (mirrors assets/css/style.css) ===== */
  :root {
    --space-black: #030712;
    --deep-space: #0a0f1e;
    --nebula-blue: #1a2744;
    --saber-blue: #00d4ff;
    --saber-green: #39ff14;
    --saber-red: #ff2d55;
    --saber-purple: #b94fff;
    --gold: #ffd700;
    --star-white: #e8f4ff;
    --muted: #6b7fa3;
    --glow-blue: rgba(0, 212, 255, 0.3);
    --glow-green: rgba(57, 255, 20, 0.3);
    --glow-gold: rgba(255, 215, 0, 0.4);
    --glow-purple: rgba(185, 79, 255, 0.3);
    --panel: rgba(10, 15, 30, 0.85);
    --line: rgba(0, 212, 255, 0.2);
    --line-soft: rgba(107, 127, 163, 0.25);
    --boing: cubic-bezier(0.34, 1.56, 0.64, 1);
    --display: 'Orbitron', 'Exo 2', monospace;
    --body: 'Exo 2', 'Segoe UI', sans-serif;
    /* The deck body is a fixed-size viewport so the card contents never
       push the nav bar around between steps. */
    --deck-height: 400px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--space-black);
    color: var(--star-white);
    font-family: var(--body);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; top: -20%; left: -20%; width: 70%; height: 70%;
    background: radial-gradient(ellipse, rgba(26, 39, 68, 0.6) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; bottom: -20%; right: -20%; width: 70%; height: 70%;
    background: radial-gradient(ellipse, rgba(60, 20, 80, 0.4) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .wrap {
    position: relative; z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding-block: 28px 40px;
    padding-inline: 16px;
    display: flex; flex-direction: column; gap: 20px;
  }

  /* ===== TITLE (as in the real app) ===== */
  .title-logo { text-align: center; }
  .title-main {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(30px, 7vw, 48px);
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 20px var(--glow-gold), 0 0 40px rgba(255, 215, 0, 0.2);
  }
  .title-sub {
    font-family: var(--display);
    font-size: clamp(9px, 2.2vw, 13px);
    letter-spacing: 6px;
    color: var(--saber-blue);
    text-transform: uppercase;
    margin-top: 6px;
  }
  .saber-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--saber-blue), transparent);
    opacity: 0.4;
  }
  .proto-tag {
    font-family: var(--display); font-size: 9px; letter-spacing: 3px;
    color: var(--muted); text-transform: uppercase; text-align: center;
  }
  .proto-tag a { color: var(--saber-blue); text-decoration: none; }

  /* ===== DECK (the setup card) ===== */
  .deck {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.08), inset 0 0 60px rgba(0, 0, 0, 0.3);
    display: flex; flex-direction: column; gap: 18px;
  }
  .deck-body {
    height: var(--deck-height);
    overflow-y: auto;
    overflow-x: hidden;
    display: flex; flex-direction: column;
    scrollbar-width: thin;
    scrollbar-color: rgba(0, 212, 255, 0.3) transparent;
  }
  .deck-nav {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 10px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  /* Flight path stepper */
  .flight-path { display: flex; align-items: flex-start; justify-content: space-between; position: relative; }
  .flight-path::before {
    content: '';
    position: absolute; left: 10%; right: 10%; top: 16px;
    border-top: 1px dashed var(--line-soft);
  }
  .fp-node {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: transparent; border: 0; cursor: default; flex: 1;
  }
  .fp-node .dot {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--deep-space);
    border: 1px solid var(--line-soft);
    font-size: 14px;
    transition: all 0.3s;
  }
  .fp-node .lbl { font-family: var(--display); font-size: 8px; letter-spacing: 1.5px; color: var(--muted); }
  .fp-node.done { cursor: pointer; }
  .fp-node.done .dot { border-color: var(--saber-green); color: var(--saber-green); box-shadow: 0 0 10px var(--glow-green); }
  .fp-node.done .lbl { color: var(--saber-green); }
  .fp-node.now .dot { border-color: var(--saber-blue); box-shadow: 0 0 14px var(--glow-blue); animation: pulse 1.6s ease-in-out infinite; }
  .fp-node.now .lbl { color: var(--saber-blue); }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

  /* Flashcard */
  .flashcard { display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
  .flashcard.in-fwd { animation: cardFwd 0.5s var(--boing) both; }
  .flashcard.in-back { animation: cardBack 0.5s var(--boing) both; }
  @keyframes cardFwd { from { opacity: 0; transform: translateX(48px) scale(0.92); } to { opacity: 1; transform: none; } }
  @keyframes cardBack { from { opacity: 0; transform: translateX(-48px) scale(0.92); } to { opacity: 1; transform: none; } }

  .setup-label {
    font-family: var(--display); font-size: 11px; letter-spacing: 4px;
    color: var(--saber-blue); text-transform: uppercase; display: block;
  }
  .step-title {
    font-family: var(--display);
    font-size: clamp(16px, 3.6vw, 22px);
    letter-spacing: 2px;
    color: var(--star-white);
    text-wrap: balance;
  }
  .step-hint { color: var(--muted); font-size: 13px; min-height: 1.5em; margin-top: auto; }
  .hint-ok { color: var(--saber-green); }

  /* ===== WIDGETS ===== */
  .quick-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .quick-btn {
    padding: 6px 14px; background: transparent;
    border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 20px;
    color: var(--gold); font-size: 12px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s;
  }
  .quick-btn:hover { background: rgba(255, 215, 0, 0.1); box-shadow: 0 0 10px var(--glow-gold); }
  .quick-btn.active-preset { background: rgba(255, 215, 0, 0.12); border-color: var(--gold); box-shadow: 0 0 14px var(--glow-gold); }

  .number-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .num-btn {
    aspect-ratio: 1; min-height: 40px;
    background: rgba(0, 212, 255, 0.05);
    border: 1px solid var(--line); border-radius: 8px;
    color: var(--muted);
    font-family: var(--display); font-size: 14px;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .num-btn:hover { border-color: var(--saber-blue); color: var(--saber-blue); }
  .num-btn.selected { background: rgba(0, 212, 255, 0.15); border-color: var(--saber-blue); color: var(--saber-blue); box-shadow: 0 0 16px var(--glow-blue); }

  .op-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .op-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 18px 10px 14px;
    background: rgba(10, 15, 30, 0.6);
    border: 1px solid var(--line-soft); border-radius: 14px;
    cursor: pointer; transition: all 0.2s; color: var(--muted);
  }
  .op-card .sym { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; filter: drop-shadow(0 0 6px currentColor); }
  .op-card .nm { font-family: var(--display); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
  .op-card.mul { color: var(--saber-purple); border-color: rgba(185, 79, 255, 0.3); }
  .op-card.mul.on { background: rgba(185, 79, 255, 0.14); border-color: var(--saber-purple); box-shadow: 0 0 18px var(--glow-purple); }
  .op-card.add { color: var(--saber-green); border-color: rgba(57, 255, 20, 0.3); }
  .op-card.add.on { background: rgba(57, 255, 20, 0.1); border-color: var(--saber-green); box-shadow: 0 0 18px var(--glow-green); }
  .op-all { align-self: flex-start; }

  .game-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .game-card {
    position: relative;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
    padding: 22px 14px 18px;
    background: rgba(10, 15, 30, 0.6);
    border: 1px solid var(--line-soft); border-radius: 16px;
    cursor: pointer; transition: all 0.25s;
  }
  .game-card .gi { font-size: 40px; line-height: 1; filter: drop-shadow(0 0 10px rgba(255,255,255,0.15)); }
  .game-card .gn { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: 3px; color: var(--star-white); }
  .game-card .gd { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .game-card:hover { transform: translateY(-2px); }
  .game-card.galactic:hover, .game-card.galactic.on { border-color: var(--saber-blue); background: rgba(0, 212, 255, 0.08); box-shadow: 0 0 24px var(--glow-blue); }
  .game-card.alien:hover, .game-card.alien.on { border-color: var(--saber-green); background: rgba(57, 255, 20, 0.06); box-shadow: 0 0 24px var(--glow-green); }
  .game-card.galactic.on .gn { color: var(--saber-blue); }
  .game-card.alien.on .gn { color: var(--saber-green); }
  .game-card.dim { opacity: 0.45; transform: scale(0.96); }
  .game-card.soon { cursor: default; border-style: dashed; opacity: 0.5; grid-column: 1 / -1; padding: 12px; flex-direction: row; gap: 12px; }
  .game-card.soon:hover { transform: none; }
  .game-card.soon .gi { font-size: 22px; }
  .check {
    position: absolute; top: 8px; right: 10px;
    font-family: var(--display); font-size: 12px; font-weight: 900;
    color: var(--saber-green); filter: drop-shadow(0 0 6px var(--saber-green));
  }

  .mode-list { display: flex; flex-direction: column; gap: 8px; }
  .mode-tile {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: rgba(10, 15, 30, 0.6);
    border: 1px solid rgba(0, 212, 255, 0.15); border-radius: 12px;
    cursor: pointer; transition: all 0.25s; text-align: left;
  }
  .mode-tile:hover { border-color: rgba(0, 212, 255, 0.4); }
  .mode-tile.on { border-color: var(--saber-blue); background: rgba(0, 212, 255, 0.08); box-shadow: 0 0 18px rgba(0, 212, 255, 0.15); }
  .mode-tile .mi { font-size: 22px; flex-shrink: 0; }
  .mode-tile .mb { flex: 1; min-width: 0; }
  .mode-tile .mn { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--star-white); margin-bottom: 2px; }
  .mode-tile .md { font-size: 11px; color: var(--muted); line-height: 1.3; }
  .badge {
    font-family: var(--display); font-size: 9px; font-weight: 700; letter-spacing: 2px;
    padding: 5px 10px; border-radius: 20px;
    border: 1px solid var(--line-soft); color: var(--muted); background: rgba(0, 0, 0, 0.3);
    flex-shrink: 0; transition: all 0.3s;
  }
  .mode-tile.on .badge { color: var(--saber-green); border-color: var(--saber-green); background: rgba(57, 255, 20, 0.1); text-shadow: 0 0 8px var(--saber-green); }

  .diff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .diff-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 6px;
    background: rgba(10, 15, 30, 0.6);
    border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 10px;
    cursor: pointer; transition: all 0.2s;
  }
  .diff-btn:hover { border-color: rgba(255, 215, 0, 0.4); }
  .diff-btn.on { border-color: var(--gold); background: rgba(255, 215, 0, 0.08); box-shadow: 0 0 14px rgba(255, 215, 0, 0.2); }
  .diff-btn .di { font-size: 18px; }
  .diff-btn .dn { font-family: var(--display); font-size: 8px; font-weight: 700; letter-spacing: 1px; color: var(--star-white); text-align: center; }
  .diff-btn .dt { font-family: var(--display); font-size: 13px; font-weight: 700; color: var(--gold); filter: drop-shadow(0 0 6px var(--gold)); }

  .briefing { display: flex; flex-direction: column; gap: 8px; }
  .brief-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; width: 100%;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--line-soft); border-radius: 10px;
    cursor: pointer; transition: all 0.2s; text-align: left;
  }
  .brief-row:hover { border-color: var(--saber-blue); }
  .brief-row .bk { font-family: var(--display); font-size: 9px; letter-spacing: 2px; color: var(--muted); width: 76px; flex-shrink: 0; }
  .brief-row .bv { flex: 1; font-size: 14px; color: var(--star-white); }
  .brief-row .be { font-family: var(--display); font-size: 9px; letter-spacing: 1px; color: var(--saber-blue); }

  /* ===== NAV BUTTONS (same slot, same size, every step) ===== */
  .nav-btn {
    height: 52px;
    border-radius: 10px;
    font-family: var(--display); font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer; transition: all 0.25s;
    position: relative; overflow: hidden;
  }
  .nav-btn span { position: relative; z-index: 1; }
  .btn-back { background: transparent; border: 1px solid var(--line-soft); color: var(--muted); }
  .btn-back:hover:not(:disabled) { color: var(--star-white); border-color: var(--saber-blue); }
  .btn-back:disabled { opacity: 0.3; cursor: default; }
  .btn-next { background: rgba(0, 212, 255, 0.1); border: 1px solid var(--saber-blue); color: var(--saber-blue); }
  .btn-next:hover:not(:disabled) { background: rgba(0, 212, 255, 0.2); box-shadow: 0 0 16px var(--glow-blue); }
  .btn-next:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-launch {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 100, 200, 0.15));
    border: 1px solid var(--saber-blue); color: var(--saber-blue);
    font-size: 14px;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
  }
  .btn-launch:hover { transform: translateY(-1px); box-shadow: 0 0 30px var(--glow-blue); }
  .btn-launch.alien {
    background: linear-gradient(135deg, rgba(57, 255, 20, 0.14), rgba(0, 120, 60, 0.15));
    border-color: var(--saber-green); color: var(--saber-green);
    box-shadow: 0 0 20px rgba(57, 255, 20, 0.1);
  }
  .btn-launch.alien:hover { box-shadow: 0 0 30px var(--glow-green); }
  .btn-launch::before {
    content: '';
    position: absolute; top: 0; left: 0; height: 100%; width: 0;
    background: linear-gradient(90deg, rgba(0,212,255,0.35), rgba(57,255,20,0.3));
    pointer-events: none;
  }
  .btn-launch.launching::before { animation: launchFill 1.1s linear forwards; }
  @keyframes launchFill { to { width: 100%; } }

  /* ===== LAUNCHED ===== */
  .launched {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;
    justify-content: center; min-height: 100%;
    animation: popIn 0.5s var(--boing) both;
  }
  .launched .big { font-size: 56px; line-height: 1; animation: liftoff 1.2s ease-out both; }
  @keyframes liftoff { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .launched h3 { font-family: var(--display); font-size: 16px; letter-spacing: 3px; color: var(--gold); text-shadow: 0 0 14px var(--glow-gold); }
  .launched p { color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 46ch; }
  .launched code {
    display: block;
    font-family: 'Courier New', monospace; font-size: 11px; color: var(--saber-blue);
    background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 8px 10px; max-width: 100%; overflow-x: auto; text-align: left; white-space: pre;
  }

  /* ===== BOUNCY MOTION ===== */
  @keyframes popIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
  @keyframes boing { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 65% { transform: scale(0.96); } 100% { transform: scale(1); } }
  .boing { animation: boing 0.4s var(--boing); }
  .pop { animation: popIn 0.4s var(--boing) both; }
  .stagger > * { animation: popIn 0.4s var(--boing) both; }
  .stagger > *:nth-child(2) { animation-delay: 50ms; }
  .stagger > *:nth-child(3) { animation-delay: 100ms; }
  .stagger > *:nth-child(4) { animation-delay: 150ms; }
  .stagger > *:nth-child(5) { animation-delay: 200ms; }

  footer { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; }
  footer a { color: var(--saber-blue); text-decoration: none; }

  @media (max-width: 520px) {
    :root { --deck-height: 440px; }
    .deck { padding: 18px 14px; }
    .deck-nav { grid-template-columns: 96px 1fr; }
    .game-cards { grid-template-columns: 1fr; }
    .fp-node .lbl { font-size: 7px; letter-spacing: 1px; }
    .brief-row .bk { width: 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="title-logo">
    <div class="title-main">GALACTIC MATH</div>
    <div class="title-sub">Space based math trainer</div>
  </div>
  <div class="saber-divider"></div>
  <div class="proto-tag">Prototype A · Flight Deck · <a href="https://linear.app/thehomefront/issue/IDT-214">IDT-214</a></div>

  <div class="deck">
    <div class="flight-path" id="flightPath"></div>
    <div class="deck-body" id="deckBody"></div>
    <div class="deck-nav" id="deckNav"></div>
  </div>

  <footer>Not wired to the real game — the launch step shows what <em>would</em> be passed along.</footer>
</div>

<script>
// ===== DATA =====
const NUMS = Array.from({ length: 14 }, (_, i) => i);
const OPS = [
  { id: 'multiply', sym: '×', name: 'Multiply', cls: 'mul' },
  { id: 'divide',   sym: '÷', name: 'Divide',   cls: 'mul' },
  { id: 'add',      sym: '+', name: 'Add',      cls: 'add' },
  { id: 'subtract', sym: '−', name: 'Subtract', cls: 'add' },
];
const GAMES = {
  galactic: { id: 'galactic', icon: '🚀', name: 'GALACTIC MATH',  desc: 'Answer 20 problems and earn your Jedi rank.' },
  alien:    { id: 'alien',    icon: '👾', name: 'ALIEN INVASION', desc: 'Fly your rocket through 20 math gates. Dodge the asteroids!' },
};
const MODES = [
  { id: 'standard',   icon: '🧘', name: 'STANDARD',   desc: { galactic: 'No timer. Go at your own pace.',                 alien: 'No timer. Fly the gates at your own pace.' } },
  { id: 'hyperspace', icon: '⚡', name: 'HYPERSPACE', desc: { galactic: 'Finish all 20 before the jump!',                 alien: 'Clear every gate before the jump!' } },
  { id: 'kessel',     icon: '☄️', name: 'KESSEL RUN', desc: { galactic: 'How fast can you finish? Wrong answers add 5s.', alien: 'Fastest run through the gates. Wrong answers add 5s.' } },
];
const DIFFS = [
  { id: 'wicked-easy', icon: '😌', name: 'Wicked Easy', time: '5:00' },
  { id: 'harder',      icon: '😤', name: 'Harder',      time: '3:00' },
  { id: 'hyperdrive',  icon: '⚡', name: 'Hyperdrive',  time: '1:00' },
];
const STEPS = [
  { id: 'nums',   icon: '🔢', label: 'NUMBERS',   title: 'Which numbers are we training?' },
  { id: 'ops',    icon: '✖️', label: 'MATH',      title: 'What kind of math?' },
  { id: 'game',   icon: '🎮', label: 'GAME',      title: 'Pick your game' },
  { id: 'mode',   icon: '⏱️', label: 'CHALLENGE', title: 'Pick your challenge' },
  { id: 'launch', icon: '🚀', label: 'LAUNCH',    title: 'Mission briefing' },
];

function newState() {
  return {
    nums: new Set(NUMS.filter(n => n >= 2 && n <= 12)),
    ops: new Set(['multiply']),
    game: null,
    mode: null,
    diff: 'wicked-easy',
    launched: false,
  };
}
const app = { state: newState(), step: 0 };

// ===== HELPERS =====
function el(tag, cls, html) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html !== undefined) node.innerHTML = html;
  return node;
}
function btn(cls, html, onClick) {
  const b = el('button', cls, html);
  b.type = 'button';
  if (onClick) b.addEventListener('click', onClick);
  return b;
}
function boing(node) {
  if (!node) return;
  node.classList.remove('boing');
  void node.offsetWidth;
  node.classList.add('boing');
}
function numsReady(s) { return s.nums.size >= 3; }
function opsReady(s) { return s.ops.size >= 1; }
function stepReady(step) {
  const s = app.state;
  return [numsReady(s), opsReady(s), !!s.game, !!s.mode, true][step];
}

function numsLabel(s) {
  const sorted = [...s.nums].sort((a, b) => a - b);
  if (!sorted.length) return 'none yet';
  const parts = [];
  let start = sorted[0], prev = sorted[0];
  for (let i = 1; i <= sorted.length; i++) {
    const n = sorted[i];
    if (n === prev + 1) { prev = n; continue; }
    parts.push(start === prev ? `${start}` : `${start}–${prev}`);
    start = prev = n;
  }
  return parts.join(', ');
}
function opsLabel(s) { return OPS.filter(o => s.ops.has(o.id)).map(o => o.sym).join(' ') || 'none yet'; }
function gameLabel(s) { const g = GAMES[s.game]; return g ? `${g.icon} ${g.name}` : ''; }
function modeLabel(s) {
  const m = MODES.find(m => m.id === s.mode);
  if (!m) return '';
  if (m.id !== 'hyperspace') return `${m.icon} ${m.name}`;
  const d = DIFFS.find(d => d.id === s.diff);
  return `${m.icon} ${m.name} · ${d.name} ${d.time}`;
}

// ===== WIDGETS =====
function numberPicker(s, onChange) {
  const box = el('div', 'stagger');
  box.style.display = 'flex'; box.style.flexDirection = 'column'; box.style.gap = '12px';
  const presets = el('div', 'quick-btns');
  const grid = el('div', 'number-grid');
  const isRange = (lo, hi) => s.nums.size === hi - lo + 1 && [...s.nums].every(n => n >= lo && n <= hi);
  const paint = () => {
    presets.children[0].classList.toggle('active-preset', isRange(2, 12));
    presets.children[1].classList.toggle('active-preset', isRange(0, 13));
    [...grid.children].forEach((b, i) => b.classList.toggle('selected', s.nums.has(i)));
  };
  const setRange = (lo, hi) => {
    s.nums = new Set(NUMS.filter(n => n >= lo && n <= hi));
    paint(); [...grid.children].forEach(boing); onChange();
  };
  presets.append(
    btn('quick-btn', 'Basic (2–12)', () => setRange(2, 12)),
    btn('quick-btn', 'All (0–13)', () => setRange(0, 13)),
    btn('quick-btn', 'Clear', () => { s.nums.clear(); paint(); onChange(); })
  );
  NUMS.forEach(n => grid.append(btn('num-btn', String(n), (e) => {
    s.nums.has(n) ? s.nums.delete(n) : s.nums.add(n);
    paint(); boing(e.currentTarget); onChange();
  })));
  box.append(presets, grid);
  paint();
  return box;
}

function opPicker(s, onChange) {
  const box = el('div');
  box.style.display = 'flex'; box.style.flexDirection = 'column'; box.style.gap = '10px';
  const grid = el('div', 'op-cards stagger');
  const paint = () => {
    [...grid.children].forEach(b => b.classList.toggle('on', s.ops.has(b.dataset.op)));
    all.classList.toggle('active-preset', s.ops.size === 4);
  };
  OPS.forEach(o => {
    const b = btn('op-card ' + o.cls, `<span class="sym">${o.sym}</span><span class="nm">${o.name}</span>`, (e) => {
      s.ops.has(o.id) ? s.ops.delete(o.id) : s.ops.add(o.id);
      paint(); boing(e.currentTarget); onChange();
    });
    b.dataset.op = o.id;
    grid.append(b);
  });
  const all = btn('quick-btn op-all', '★ All four', (e) => {
    s.ops = new Set(OPS.map(o => o.id)); paint(); [...grid.children].forEach(boing); onChange();
  });
  box.append(grid, all);
  paint();
  return box;
}

function gamePicker(s, onPick) {
  const grid = el('div', 'game-cards stagger');
  Object.values(GAMES).forEach(g => {
    const card = btn('game-card ' + g.id, `<span class="gi">${g.icon}</span><span class="gn">${g.name}</span><span class="gd">${g.desc}</span>`, (e) => {
      s.game = g.id;
      [...grid.querySelectorAll('.game-card:not(.soon)')].forEach(c => {
        c.classList.toggle('on', c === e.currentTarget);
        c.classList.toggle('dim', c !== e.currentTarget);
      });
      if (!e.currentTarget.querySelector('.check')) e.currentTarget.append(el('span', 'check pop', '✓'));
      boing(e.currentTarget);
      onPick();
    });
    if (s.game === g.id) { card.classList.add('on'); card.append(el('span', 'check', '✓')); }
    else if (s.game) card.classList.add('dim');
    grid.append(card);
  });
  // Room for the next game: the step is a list of cards, not a pair of buttons.
  const soon = el('div', 'game-card soon', `<span class="gi">🛸</span><span class="gd">More games coming soon</span>`);
  grid.append(soon);
  return grid;
}

function diffPicker(s, onPick) {
  const grid = el('div', 'diff-grid stagger');
  DIFFS.forEach(d => {
    grid.append(btn('diff-btn' + (s.diff === d.id ? ' on' : ''),
      `<span class="di">${d.icon}</span><span class="dn">${d.name}</span><span class="dt">${d.time}</span>`, (e) => {
        s.diff = d.id;
        [...grid.children].forEach(c => c.classList.toggle('on', c === e.currentTarget));
        boing(e.currentTarget);
        onPick();
      }));
  });
  return grid;
}

// onPick(final): final is true when the choice needs no further input.
function modePicker(s, onPick) {
  const list = el('div', 'mode-list stagger');
  const gameId = s.game || 'galactic';
  let diffBox = null;
  const paint = () => [...list.querySelectorAll('.mode-tile')].forEach(t => {
    const on = t.dataset.mode === s.mode;
    t.classList.toggle('on', on);
    t.querySelector('.badge').textContent = on ? 'ON' : 'OFF';
  });
  const showDiff = () => {
    if (diffBox) return;
    diffBox = diffPicker(s, () => onPick(true));
    list.querySelector('[data-mode="hyperspace"]').after(diffBox);
  };
  const hideDiff = () => { if (diffBox) { diffBox.remove(); diffBox = null; } };
  MODES.forEach(m => {
    const t = btn('mode-tile', `<span class="mi">${m.icon}</span><div class="mb"><div class="mn">${m.name}</div><div class="md">${m.desc[gameId]}</div></div><span class="badge">OFF</span>`, (e) => {
      s.mode = m.id;
      paint(); boing(e.currentTarget);
      if (m.id === 'hyperspace') { showDiff(); onPick(false); }
      else { hideDiff(); onPick(true); }
    });
    t.dataset.mode = m.id;
    list.append(t);
  });
  paint();
  if (s.mode === 'hyperspace') showDiff();
  return list;
}

function launchedView(s, onRestart) {
  const g = GAMES[s.game];
  const nums = [...s.nums].sort((a, b) => a - b).join(',');
  const ops = [...s.ops].join(',');
  const modeParam = s.mode === 'hyperspace' ? `hyperspace:${s.diff}` : s.mode;
  const target = g.id === 'galactic'
    ? `index.html → startQuiz()\nnums=${nums}\nops=${ops}\nmode=${modeParam}`
    : `pages/alien-invasion.html\n?nums=${nums}\n&ops=${ops}\n&mode=${modeParam}   ← not read by the game yet`;
  const box = el('div', 'launched');
  box.append(
    el('div', 'big', g.icon),
    el('h3', '', `LAUNCHING ${g.name}`),
    el('p', '', `${numsLabel(s)} · ${opsLabel(s)} · ${modeLabel(s)}`),
    el('code', '', target)
  );
  return box;
}

// ===== RENDER =====
const flightPath = document.getElementById('flightPath');
const deckBody = document.getElementById('deckBody');
const deckNav = document.getElementById('deckNav');

function go(step, dir) {
  app.step = Math.max(0, Math.min(STEPS.length - 1, step));
  render(dir);
}

function renderFlightPath() {
  flightPath.innerHTML = '';
  STEPS.forEach((st, i) => {
    const done = app.state.launched || i < app.step;
    const cls = done ? 'done' : i === app.step ? 'now' : '';
    flightPath.append(btn('fp-node ' + cls, `<span class="dot">${done ? '✓' : st.icon}</span><span class="lbl">${st.label}</span>`, () => {
      if (i < app.step && !app.state.launched) go(i, 'back');
    }));
  });
}

// The nav bar keeps the same two slots on every step: Back on the left
// (disabled on the first card rather than hidden), and one primary action on
// the right — Next, or Begin Mission on the briefing card.
function renderNav(next) {
  deckNav.innerHTML = '';
  const s = app.state;
  const back = btn('nav-btn btn-back', '<span>◂ Back</span>', () => go(app.step - 1, 'back'));
  back.disabled = app.step === 0 || s.launched;
  deckNav.append(back);
  if (s.launched) {
    deckNav.append(btn('nav-btn btn-next', '<span>↺ New Mission</span>', () => { app.state = newState(); app.step = 0; render('fwd'); }));
  } else if (STEPS[app.step].id === 'launch') {
    const g = GAMES[s.game];
    const launch = btn('nav-btn btn-launch ' + g.id, `<span>${g.icon} Begin Mission</span>`, (e) => {
      const me = e.currentTarget;
      if (me.classList.contains('launching')) return;
      me.classList.add('launching');
      setTimeout(() => { s.launched = true; render('fwd'); }, 1150);
    });
    deckNav.append(launch);
  } else {
    deckNav.append(next);
  }
}

function render(dir) {
  const s = app.state;
  renderFlightPath();
  deckBody.innerHTML = '';
  deckBody.scrollTop = 0;

  if (s.launched) {
    deckBody.append(launchedView(s));
    renderNav();
    return;
  }

  const step = STEPS[app.step];
  const card = el('div', 'flashcard ' + (dir === 'back' ? 'in-back' : 'in-fwd'));
  card.append(el('span', 'setup-label', `Step ${app.step + 1} of ${STEPS.length}`));
  card.append(el('h3', 'step-title', step.title));

  const hint = el('p', 'step-hint');
  const next = btn('nav-btn btn-next', '<span>Next ▸</span>', () => go(app.step + 1, 'fwd'));
  const refresh = () => {
    next.disabled = !stepReady(app.step);
    if (step.id === 'nums') {
      hint.textContent = numsReady(s) ? `${s.nums.size} numbers · ${numsLabel(s)}` : 'Pick at least 3 numbers';
      hint.classList.toggle('hint-ok', numsReady(s));
    } else if (step.id === 'ops') {
      hint.textContent = opsReady(s) ? `Training ${opsLabel(s)}` : 'Pick at least one';
      hint.classList.toggle('hint-ok', opsReady(s));
    }
  };

  if (step.id === 'nums') {
    card.append(numberPicker(s, refresh));
  } else if (step.id === 'ops') {
    card.append(opPicker(s, refresh));
  } else if (step.id === 'game') {
    hint.textContent = 'Tap one — the next card comes right up.';
    card.append(gamePicker(s, () => setTimeout(() => go(3, 'fwd'), 420)));
  } else if (step.id === 'mode') {
    hint.textContent = 'Standard is a fine place to start.';
    card.append(modePicker(s, (final) => { if (final) setTimeout(() => go(4, 'fwd'), 420); else refresh(); }));
  } else {
    const brief = el('div', 'briefing stagger');
    [['Numbers', numsLabel(s), 0], ['Math', opsLabel(s), 1], ['Game', gameLabel(s), 2], ['Challenge', modeLabel(s), 3]].forEach(([k, v, i]) => {
      brief.append(btn('brief-row', `<span class="bk">${k}</span><span class="bv">${v}</span><span class="be">CHANGE</span>`, () => go(i, 'back')));
    });
    card.append(brief);
    hint.textContent = 'Everything look right? Tap a row to change it.';
  }
  card.append(hint);
  deckBody.append(card);
  refresh();
  renderNav(next);
}

render('fwd');
</script>
</body>
</html>
